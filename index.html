<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniStaq POS</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d2a1c">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OmniStaq"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style id="pg"></style>
<style>
:root{--bg:#f4f7f3;--card:#fff;--ink:#12261c;--mut:#667a6f;--line:#dfe8e1;--g:#1fb862;--gd:#0d2a1c;--gold:#e0a030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1510;--card:#14221a;--ink:#e6f1ea;--mut:#8aa396;--line:#223a2c;--gd:#06120c}}
:root[data-theme=dark]{--bg:#0b1510;--card:#14221a;--ink:#e6f1ea;--mut:#8aa396;--line:#223a2c;--gd:#06120c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Figtree,system-ui,sans-serif}
header{background:var(--gd);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{height:38px}header b{font-size:15px}header small{display:block;opacity:.65;font-size:12px}
main{max-width:980px;margin:0 auto;padding:14px 14px 150px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:14px 4px;font:600 14px Figtree,sans-serif}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--g);color:#04210f;font-weight:800;cursor:pointer;width:100%}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.d{background:#d94c4c;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:600;cursor:pointer}
.chip.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;position:relative}
.pc:active{transform:scale(.97)}.pc .e{font-size:30px}.pc b{display:block;font-size:14px;margin-top:4px}.pc span{color:var(--g);font-weight:800}
.pc .n{position:absolute;top:8px;right:8px;background:var(--g);color:#04210f;border-radius:99px;min-width:24px;text-align:center;font-weight:800;font-size:13px;padding:1px 6px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:956px;margin:auto;background:var(--gd);color:#fff;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:4;cursor:pointer;box-shadow:0 8px 24px #0004}
.bar b{color:var(--g);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 2px;font-weight:700;color:var(--mut);cursor:pointer}.seg .on{background:var(--gd);color:#fff}
.hero{background:var(--gd);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}.hero small{opacity:.7}.hero h1{margin:2px 0 0;font-size:34px;color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.kp div{background:#ffffff12;border-radius:10px;padding:8px 10px}.kp b{display:block;font-size:16px}
.ch{display:flex;align-items:flex-end;gap:3px;height:130px}.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ch i{width:100%;background:var(--g);border-radius:4px 4px 0 0;min-height:2px}.ch small{font-size:10px;color:var(--mut);height:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.tb{height:6px;background:var(--line);border-radius:9px;margin-top:5px}.tb i{display:block;height:100%;background:var(--gold);border-radius:9px}
.mut{color:var(--mut)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin:10px 0 4px}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.q{display:flex;align-items:center;gap:8px}.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:17px}
#t{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:20}
.rc{margin:0 auto;background:#fff;color:#000;font-family:'Courier New',monospace;line-height:1.3;padding:2mm 0}.rc img{display:block;margin:0 auto 4px;height:15mm;filter:brightness(0)}
.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:4px}.rc hr{border:0;border-top:1px dashed #000;margin:5px 0}.rc .t{font-size:1.35em;font-weight:700}
.pv{background:#e8ece9;padding:12px;border-radius:12px;overflow:auto;margin-bottom:12px}#rc{display:none}#rc img{display:block;margin:0;image-rendering:pixelated}
#pd{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}
.oc{background:var(--card);border-radius:20px;padding:26px 28px;min-width:250px;max-width:88%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 12px 40px #0006}.oc .btn{width:100%;margin-top:8px}.oc small{max-width:260px}
.tk{width:78px;height:78px}.tk circle,.tk path{fill:none;stroke:var(--g);stroke-linecap:round;stroke-linejoin:round;animation:dr .5s forwards}.tk circle{stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151}.tk path{stroke-width:4;stroke-dasharray:40;stroke-dashoffset:40;animation-duration:.35s;animation-delay:.4s}@keyframes dr{to{stroke-dashoffset:0}}
.sp{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:rt .7s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.xx{width:64px;height:64px;border-radius:50%;background:#d94c4c;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
@media print{:root{padding:0!important}html,body{background:#fff;margin:0!important;padding:0!important}body>*:not(#rc){display:none!important}#rc{display:block!important}.rc{padding:0}}
</style></head><body>
